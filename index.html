<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="keywords"
      content="Dia i Nit, Turnos, Tareas, Gestión, Empleados, Calendario, PWA, App, 24 horas"
    />
    <meta name="author" content="Edinarweb" />
    <meta
      name="description"
      content="Aplicación de gestión de turnos y tareas para empleados de Dia & Nit 24H"
    />
    <title>Dia i Nit 24 horas - Gestión de Turnos y Tareas</title>

    <!-- Configuración PWA e iOS/Apple -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#3f2596" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Dia & Nit" />

    <!-- Fuente externa -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Hoja de estilos -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Cabecera principal -->
    <header>
      <div class="logo">
        <span>🛒 Dia i Nit 24 Horas</span>
        <span class="badge-24h">Gestión de Turnos y Tareas</span>
      </div>

      <div class="header-actions">
        <button
          class="btn btn-install"
          id="installPwaBtn"
          style="display: none"
        >
          📲 Descargar App
        </button>
        <button class="btn" id="openModalBtn">
          <span>+</span> Asignar Turno / Tarea
        </button>
      </div>
    </header>

    <!-- Contenedor del Calendario -->
    <main>
      <div class="controls">
        <h2>Calendario de Turnos</h2>
        <div class="mobile-day-selector" id="mobileDaySelector"></div>
      </div>

      <div class="calendar-grid" id="calendarGrid"></div>
    </main>

    <!-- Modal para Agregar Tarea -->
    <div class="modal-overlay" id="taskModal">
      <div class="modal">
        <h3 class="modal-title">Asignar Tarea</h3>
        <form id="taskForm">
          <div class="form-group">
            <label for="employee">Empleado</label>
            <input
              type="text"
              id="employee"
              class="form-control"
              placeholder="Ej: María García"
              required
            />
          </div>

          <div class="form-group">
            <label for="day">Día de la Semana</label>
            <select id="day" class="form-control" required>
              <option value="0">Lunes</option>
              <option value="1">Martes</option>
              <option value="2">Miércoles</option>
              <option value="3">Jueves</option>
              <option value="4">Viernes</option>
              <option value="5">Sábado</option>
              <option value="6">Domingo</option>
            </select>
          </div>

          <div class="form-group">
            <label for="shift">Turno (24H)</label>
            <select id="shift" class="form-control" required>
              <option value="manana">Mañana (08:00 - 15:30)</option>
              <option value="tarde">Tarde (19:00 - 23:00)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="task">Tarea Principal</label>
            <textarea
              id="task"
              class="form-control"
              rows="3"
              placeholder="Ej: Reposición de lácteos y cobro en caja"
              required
            ></textarea>
          </div>

          <div class="modal-actions">
            <button type="button" class="btn btn-secondary" id="closeModalBtn">
              Cancelar
            </button>
            <button type="submit" class="btn">Guardar</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lógica JavaScript -->
    <script src="app.js" defer></script>
  </body>
</html>
