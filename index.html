<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#5B2DCB">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="description" content="Gestión local de tareas y empleados para Dia & Nit.">
    <title>Dia & Nit — Gestión de tareas</title>
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="app">
        <aside id="sidebar" aria-label="Navegación principal">
            <div class="logo">
                <h1>Dia & Nit</h1>
                <p>Gestión de tareas</p>
                <!-- <button id="employeesButton" class="header-button" type="button">Empleados</button> -->
            </div>
            <nav>
                <ul class="menu">
                    <li class="active"><a href="#content" aria-current="page"><span aria-hidden="true">⌂</span><span>Inicio</span></a></li>
                    <li><a href="#calendar"><span aria-hidden="true">◫</span><span>Calendario</span></a></li>
                    <li><a href="#content"><span aria-hidden="true">✓</span><span>Tareas</span></a></li>
                    <li><button class="menu-button" type="button" data-open-employees><span aria-hidden="true">♙</span><span>Empleados</span></button></li>
                </ul>
            </nav>
        </aside>
        <main id="main">
            <header id="header">
                <div><h2>Dashboard</h2></div>
                <div><label class="sr-only" for="search">Buscar tareas</label><input id="search" type="search" placeholder="Buscar tareas…" autocomplete="off"></div>
                <div class="header-actions">
                    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambiar tema" title="Cambiar tema">◐</button>
                    <div id="today" aria-live="polite"></div>
                </div>
            </header>
            <section id="content" aria-labelledby="summaryTitle">
                <h2 id="summaryTitle">Resumen</h2>
                <div class="stats">
                    <button class="stat-card" id="cardToday" type="button"><span>Tareas hoy</span><strong id="todayTasks">0</strong></button>
                    <button class="stat-card" id="cardPending" type="button"><span>Pendientes</span><strong id="pendingTasks">0</strong></button>
                    <button class="stat-card" id="cardCompleted" type="button"><span>Completadas</span><strong id="completedTasks">0</strong></button>
                    <button class="stat-card" id="cardEmployees" type="button"><span>Empleados</span><strong id="employeeCount">0</strong></button>
                </div>
                <div class="calendar-placeholder"><div id="calendar"></div></div>
            </section>
        </main>
    </div>
    <script type="module" src="assets/js/core/app.js"></script>
</body>
</html>
